<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fox School Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-screen="home" aria-label="Go home"><img class="brand-fox" src="assets%20images%20fox/Fox-happy.jpg" alt="Fox mascot"><span>Fox School<br><b>Quest</b></span></button>
      <div class="top-actions">
        <div class="streak"><span>STAR</span><b id="starCount">3</b></div>
        <div class="audio-controls" aria-label="Audio controls">
          <button class="top-sound" id="soundToggle" type="button" aria-label="Toggle word and instruction sound" aria-pressed="true">SOUND ON</button>
          <button class="top-sound top-music" id="musicToggle" type="button" aria-label="Toggle background music" aria-pressed="true"><span aria-hidden="true">♪</span> MUSIC ON</button>
        </div>
      </div>
    </header>
    <div class="layout">
      <aside class="sidebar">
        <p class="eyebrow">MY ADVENTURE</p>
        <nav>
          <button class="nav-item active" data-screen="home"><span class="nav-icon icon-home" aria-hidden="true"></span><span>Home</span></button>
          <button class="nav-item" data-screen="word"><span class="nav-icon icon-word" aria-hidden="true"></span><span>Build a Word</span></button>
          <button class="nav-item" data-screen="colour"><span class="nav-icon icon-colour" aria-hidden="true"></span><span>Colour Mission</span></button>
          <button class="nav-item" data-screen="find"><span class="nav-icon icon-find" aria-hidden="true"></span><span>Tap & Find</span></button>
          <button class="nav-item" data-screen="pairs"><span class="nav-icon icon-pairs" aria-hidden="true"></span><span>Match Pairs</span></button>
          <button class="nav-item" data-screen="sentence"><span class="nav-icon icon-sentence" aria-hidden="true"></span><span>Make a Sentence</span></button>
          <button class="nav-item nav-final" data-screen="final"><span class="nav-icon icon-final" aria-hidden="true"></span><span>Fox Final Mission</span></button>
        </nav>
        <div class="sidebar-bottom"><button class="backpack-reward" data-screen="backpack"><span class="backpack-reward-icon" aria-hidden="true"></span><span class="backpack-reward-copy"><small>REWARD SPACE</small><strong>My Backpack</strong><em>Open collection</em></span><span class="backpack-badge">OPEN</span></button></div>
      </aside>
      <main class="main" id="main"></main>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="app.js?v=18"></script>
</body>
</html>
